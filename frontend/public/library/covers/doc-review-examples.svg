  <text x="726" y="440" text-anchor="middle" font-family="'Songti SC','SimSun',serif" font-size="150" font-weight="700" fill="#EFEAF6">证</text>
  <circle cx="726" cy="150" r="46" fill="none" stroke="#6B4E8E" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.5"/>
  <circle cx="726" cy="150" r="28" fill="#6B4E8E" opacity="0.12"/>
