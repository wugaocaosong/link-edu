      <circle cx="17" cy="18" r="0.6" fill="#EFE8DA"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#p)"/>
  <rect x="0" y="0" width="800" height="10" fill="#6B4E8E"/>
  <rect x="56" y="58" width="193" height="34" rx="17" fill="#EFEAF6"/>
  <text x="152.5" y="81" text-anchor="middle" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#6B4E8E">评课说明 · 证据对照</text>

  <text x="56" y="176" font-family="'Songti SC','SimSun',serif" font-size="38" font-weight="700" fill="#2C2730">六维证据对照例</text>
